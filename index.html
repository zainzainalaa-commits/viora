<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Viora</title>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
    <link rel="preconnect" href="https://v3-cinemeta.strem.io" crossorigin />
    <link rel="preconnect" href="https://api.strem.io" crossorigin />
    <link rel="dns-prefetch" href="https://www.omdbapi.com" />
    <link rel="dns-prefetch" href="https://www.youtube-nocookie.com" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=sentient@400,500,600,700,401,501,601,701&f[]=switzer@400,500,600,700&f[]=general-sans@400,500,600,700&f[]=cabinet-grotesk@400,500,700,800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #root {
        background: #0a0a0a;
        color-scheme: dark;
        margin: 0;
        height: 100%;
      }
      #harbor-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        z-index: 9999;
        pointer-events: none;
        transition: opacity 280ms ease-out;
      }
      #harbor-boot.gone { opacity: 0; }
      .boot-lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      #harbor-boot svg {
        width: 96px;
        height: auto;
        color: #f5f5f5;
        filter: drop-shadow(0 10px 30px rgba(232, 170, 108, 0.22));
        animation:
          harborBootBob 2400ms ease-in-out infinite,
          harborBootGlow 2400ms ease-in-out infinite;
      }
      .boot-name {
        font: 600 30px/1 "Iowan Old Style", Georgia, serif;
        letter-spacing: -0.5px;
        color: #f5f5f5;
      }
      /* Loaded from the bundle, so on first paint this falls back to a system
         script face and swaps once the app stylesheet lands. */
      .boot-sig {
        font: 400 15px/1 "WonderfulFontyCure", "Segoe Script", "Brush Script MT",
          "Lucida Handwriting", "Apple Chancery", cursive;
        color: #8a8a8a;
      }
      @keyframes harborBootBob {
        0%   { transform: translateY(0)    scale(0.98); }
        50%  { transform: translateY(-4px) scale(1.02); }
        100% { transform: translateY(0)    scale(0.98); }
      }
      @keyframes harborBootGlow {
        0%, 100% { opacity: 0.78; }
        50%      { opacity: 1; }
      }
    </style>
    <script>
      (function () {
        try {
          var p = new URLSearchParams(window.location.search);
          if (p.get('harbor-modal') === '1') {
            var s = document.createElement('style');
            s.textContent = '#harbor-boot{display:none !important}';
            document.head.appendChild(s);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="harbor-boot">
      <div class="boot-lockup">
        <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="60" height="60" rx="17" fill="currentColor" />
          <path
            d="M19.5 21 L32 43.5 L44.5 21"
            stroke="#0a0a0a"
            stroke-width="6.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
          />
        </svg>
        <div class="boot-name">Viora</div>
        <div class="boot-sig">zayo0ni</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
