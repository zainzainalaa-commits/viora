name: Android

# Builds an installable APK on every push and attaches one to a release when a
# version tag lands. Linux runners have no symlink restriction, so the official
# `tauri android build` works here — the local build-apk.mjs workaround is only
# needed on Windows hosts.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Build a release APK instead of debug"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The workflow token is read-only by default, so publishing a release 403s
    # at the very last step — after a nine-minute build has already succeeded.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # Keyed on the lockfile so a dependency bump busts it, and on the OS so a
      # runner image change does not resurrect stale artefacts.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and build the web bundle
        run: pnpm run build

      # Release APKs must be signed or Android refuses to install them. Without
      # the secrets the Gradle config falls back to the debug key, which is
      # still installable — just not suitable for distribution.
      - name: Write the signing keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "no keystore secret — release builds will use the debug key"
            exit 0
          fi
          dir=src-tauri/gen/android
          echo "$KEYSTORE" | base64 -d > "$dir/viora-release.jks"
          # Written rather than interpolated inline so the password never lands
          # in the step's echoed command line.
          {
            echo "storeFile=viora-release.jks"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$STORE_PASS"
          } > "$dir/keystore.properties"
          echo "keystore configured"

      # arm64 plus armv7: plenty of cheap TV boxes and older Fire TV sticks are
      # still 32-bit, and an arm64-only APK simply refuses to install there with
      # no explanation beyond "App not installed". x86 is skipped — no shipping
      # Android TV runs it.
      - name: Build the APK
        run: |
          if [ "${{ github.ref_type == 'tag' || inputs.release }}" = "true" ]; then
            pnpm exec tauri android build --target aarch64 armv7 --apk
          else
            pnpm exec tauri android build --debug --target aarch64 armv7 --apk
          fi

      - name: Locate the APK
        id: apk
        run: |
          # Two targets produce a universal APK carrying both ABIs; prefer it
          # over the per-ABI splits sitting in the same tree.
          path=$(find src-tauri/gen/android/app/build/outputs/apk -name '*universal*.apk' | head -1)
          [ -n "$path" ] || path=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          [ -n "$path" ] || { echo "no APK produced"; exit 1; }
          versioned="Viora-${{ steps.meta.outputs.version }}-android.apk"
          cp "$path" "$versioned"
          # The version-less copy is what makes /releases/latest/download/ work:
          # that path needs a filename that never changes, so a TV configured
          # once keeps fetching the newest build forever.
          cp "$path" "Viora-android.apk"
          # Alias kept so any address already written down keeps resolving, even
          # though the file is no longer arm64-only.
          cp "$path" "Viora-arm64.apk"
          echo "path=$versioned" >> "$GITHUB_OUTPUT"
          ls -lh "$versioned" "Viora-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: viora-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # A tag publishes a release, which gives the TV a plain URL to fetch
      # through the Downloader app instead of a login-gated artifact.
      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.path }}
            Viora-android.apk
            Viora-arm64.apk
          generate_release_notes: true
          body: |
            Carries both arm64 and armv7, so it installs on 32-bit TV boxes too.

            **Install on Android TV** — open Downloader and enter this address,
            which always resolves to the newest release:

            `https://github.com/${{ github.repository }}/releases/latest/download/Viora-android.apk`

            Set it once; every future update arrives at the same address. Allow
            installation from unknown sources when prompted.

            Builds are signed with the standard Android debug key, so a newer
            build installs over an older one without uninstalling first.
